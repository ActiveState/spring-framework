description = "Spring TestContext Framework"

dependencyManagement {
	imports {
		mavenBom "io.projectreactor:reactor-bom:${reactorVersion}"
		mavenBom "io.netty:netty-bom:${nettyVersion}"
	}
}

dependencies {
	compile(project(":spring-core"))
	compileOnly(project(":spring-aop"))
	compileOnly(project(":spring-beans"))
	compileOnly(project(":spring-context"))
	compileOnly(project(":spring-jdbc"))
	compileOnly(project(":spring-orm"))
	compileOnly(project(":spring-tx"))
	compileOnly(project(":spring-web"))
	compileOnly(project(":spring-webflux"))
	compileOnly(project(":spring-webmvc"))
	compileOnly(project(":spring-websocket"))
	compileOnly("javax.activation:activation:1.1.1")
	compileOnly("javax.el:javax.el-api:3.0.1-b04")
	compileOnly("javax.inject:javax.inject:1")
	compileOnly("javax.servlet:javax.servlet-api:4.0.1")
	compileOnly("javax.servlet.jsp:javax.servlet.jsp-api:2.3.2-b02")
	compileOnly("javax.servlet.jsp.jstl:javax.servlet.jsp.jstl-api:1.2.1")
	compileOnly("javax.xml.bind:jaxb-api:2.3.0")
	compileOnly("javax.websocket:javax.websocket-api:1.1")
	compileOnly("junit:junit:4.12")
	compileOnly("org.junit.jupiter:junit-jupiter-api:${junitJupiterVersion}")
	compileOnly("org.testng:testng:6.14.3")
	compileOnly("org.aspectj:aspectjweaver:${aspectjVersion}")
	compileOnly("org.codehaus.groovy:groovy-all:${groovyVersion}")
	compileOnly("org.hamcrest:hamcrest-core:1.3")
	compileOnly("org.apache.taglibs:taglibs-standard-jstlel:1.2.5") {
		exclude group: "org.apache.taglibs", module: "taglibs-standard-spec"
	}
	compileOnly("net.sourceforge.htmlunit:htmlunit:2.31") {
		exclude group: "commons-logging", module: "commons-logging"
	}
	compileOnly("org.seleniumhq.selenium:htmlunit-driver:2.31.0") {
		exclude group: "commons-logging", module: "commons-logging"
	}
	compileOnly("org.seleniumhq.selenium:selenium-java:3.13.0") {
		exclude group: "commons-logging", module: "commons-logging"
		exclude group: "io.netty", module: "netty"
	}
	compileOnly("org.xmlunit:xmlunit-matchers:2.5.1")
	compileOnly("org.skyscreamer:jsonassert:1.5.0")
	compileOnly("com.jayway.jsonpath:json-path:2.4.0")
	compileOnly("org.jetbrains.kotlin:kotlin-reflect:${kotlinVersion}")
	compileOnly("org.jetbrains.kotlin:kotlin-stdlib:${kotlinVersion}")
	compileOnly("io.projectreactor:reactor-test")
	testCompile(project(":spring-context-support"))
	testCompile(project(":spring-oxm"))
	testCompile("javax.annotation:javax.annotation-api:1.3.2")
	testCompile("javax.cache:cache-api:1.1.0")
	testCompile("javax.ejb:javax.ejb-api:3.2")
	testCompile("javax.interceptor:javax.interceptor-api:1.2.1")
	testCompile("javax.mail:javax.mail-api:1.6.1")
	testCompile("org.hibernate:hibernate-core:5.2.17.Final")
	testCompile("org.hibernate:hibernate-validator:6.0.10.Final")
	// Enable use of the JUnit Platform Runner
	testCompile("org.junit.platform:junit-platform-runner:${junitPlatformVersion}")
	testCompile("org.junit.jupiter:junit-jupiter-params:${junitJupiterVersion}")
	testCompile("com.fasterxml.jackson.core:jackson-databind:${jackson2Version}")
	testCompile("com.thoughtworks.xstream:xstream:1.4.10")
	testCompile("com.rometools:rome:1.9.0")
	testCompile("org.apache.tiles:tiles-api:${tiles3Version}")
	testCompile("org.apache.tiles:tiles-core:${tiles3Version}", withoutJclOverSlf4J)
	testCompile("org.apache.tiles:tiles-servlet:${tiles3Version}", withoutJclOverSlf4J)
	testCompile("org.hsqldb:hsqldb:${hsqldbVersion}")
	testCompile("org.apache.httpcomponents:httpclient:4.5.5") {
		exclude group: "commons-logging", module: "commons-logging"
	}
	testCompile("io.projectreactor.ipc:reactor-netty")
	testCompile("de.bechte.junit:junit-hierarchicalcontextrunner:4.12.1")
	// Pull in the latest JUnit 5 Launcher API and the Vintage engine as well
	// so that we can run JUnit 4 tests in IntelliJ IDEA.
	testRuntime("org.junit.jupiter:junit-jupiter-engine:${junitJupiterVersion}")
	testRuntime("org.junit.platform:junit-platform-launcher:${junitPlatformVersion}")
	testRuntime("org.junit.vintage:junit-vintage-engine:${junitVintageVersion}")
	testRuntime("org.glassfish:javax.el:3.0.1-b08")
	testRuntime("com.sun.xml.bind:jaxb-core:2.3.0")
	testRuntime("com.sun.xml.bind:jaxb-impl:2.3.0")
}

task testNG(type: Test) {
	description = "Runs TestNG tests."
	useTestNG()
	scanForTestClasses = false
	include(["**/testng/**/*Tests.class", "**/testng/**/*Test.class"])
	// Show STD_OUT & STD_ERR of the test JVM(s) on the console:
	// testLogging.showStandardStreams = true
	// forkEvery 1
	reports.junitXml.destination = file("$buildDir/test-results")
}

test {
	description = "Runs JUnit tests."
	dependsOn testNG
	useJUnit()
	scanForTestClasses = false
	include(["**/*Tests.class", "**/*Test.class", "**/SpringJUnitJupiterTestSuite.class"])
	exclude(["**/testng/**/*.*"])
	// Java Util Logging for JUnit 5.
	// systemProperty("java.util.logging.manager", "org.apache.logging.log4j.jul.LogManager")
	reports.junitXml.destination = file("$buildDir/test-results")
}

task aggregateTestReports(type: TestReport) {
	description = "Aggregates JUnit and TestNG test reports."
	destinationDir = test.reports.html.destination
	reportOn test, testNG
}

check.dependsOn aggregateTestReports
